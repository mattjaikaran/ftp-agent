services:
  agent:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - agent-data:/data
      - ./config:/app/config:ro
      - ./prompts:/app/prompts:ro
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    profiles:
      - gpu
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]

volumes:
  agent-data:
  ollama-data:
