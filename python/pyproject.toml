[project]
name = "ftp-agent"
version = "2.0.0"
description = "Autonomous DevOps migration system — LLM-powered SFTP/Exchange config translation"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "httpx>=0.28",
    "aiosqlite>=0.21",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "structlog>=24.4",
    "tenacity>=9.0",
    "typer>=0.15",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "websockets>=14.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.43"]
openai = ["openai>=1.60"]
all-llm = ["anthropic>=0.43", "openai>=1.60"]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "respx>=0.22",
    "httpx>=0.28",
    "ruff>=0.9",
    "mypy>=1.14",
]

[project.scripts]
ftp-agent = "ftp_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py312"
line-length = 99

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "S", "B", "A", "C4",
    "DTZ", "T20", "RET", "SIM", "TCH", "PTH", "RUF", "ASYNC", "LOG",
]
ignore = [
    "S101", "S603", "S607", "S108",
    "TC001", "TC003", "A002", "RUF015", "RUF059",
    "UP042", "ASYNC240", "E402",
]

[tool.ruff.lint.isort]
known-first-party = ["ftp_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["anthropic", "anthropic.*"]
ignore_missing_imports = true

[tool.coverage.report]
fail_under = 65
show_missing = true
