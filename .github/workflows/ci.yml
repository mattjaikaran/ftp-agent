# CI/CD Pipeline for FtpAgent (C# + Python)
# Status badge: ![CI](https://github.com/<OWNER>/ftp-agent/actions/workflows/ci.yml/badge.svg)

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: "8.0.x"
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  PYTHON_VERSION: "3.12"

jobs:
  # ── C# ──────────────────────────────────────────
  csharp-build:
    name: "C# Build & Test"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: csharp

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore FtpAgent.sln

      - name: Build (Release)
        run: dotnet build FtpAgent.sln --configuration Release --no-restore --warnaserror

      - name: Run tests
        run: >-
          dotnet test FtpAgent.sln
          --configuration Release
          --no-build
          --verbosity normal
          --logger "trx;LogFileName=test-results.trx"
          --results-directory ./test-results

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: csharp-test-results
          path: csharp/test-results/*.trx
          retention-days: 30

  csharp-quality:
    name: "C# Code Quality"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: csharp

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore FtpAgent.sln

      - name: Check formatting
        run: dotnet format FtpAgent.sln --verify-no-changes --verbosity diagnostic

  # ── Python ──────────────────────────────────────
  python-test:
    name: "Python Test"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run tests with coverage
        run: uv run pytest tests/ --tb=short -q --cov=ftp_agent --cov-report=term-missing --cov-fail-under=65

  python-quality:
    name: "Python Lint & Format"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Ruff check
        run: uv run ruff check ftp_agent/ tests/

      - name: Ruff format check
        run: uv run ruff format --check ftp_agent/ tests/

  python-frontend:
    name: "Frontend Build"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python/frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run tsc -b

      - name: Build
        run: bun run build

  docker-smoke:
    name: "Docker Build Smoke Test"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t ftp-agent:ci .

      - name: Verify image exists
        run: docker image inspect ftp-agent:ci
